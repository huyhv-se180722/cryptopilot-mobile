name: cryptopilot_mobile
description: "CryptoPilot mobile client"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # TECHNICAL_DESIGN 1.3
  dio: ^5.11.1
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.3
  stomp_dart_client: ^3.0.1
  # D-141 (ADR-023)
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.2
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/brand/
